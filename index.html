<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Of Ambition and Grind — Banner Generator</title>
  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">EMAIL SIGNATURE BANNER</p>
        <h1>Of Ambition and Grind</h1>
        <p class="muted">600 × 200 px · downward semicircle reveal</p>
      </div>

      <div class="badge">GITHUB PAGES READY</div>
    </header>

    <section class="grid">

      <aside class="panel">

        <h2>Content</h2>

        <label>
          Background image
          <input id="imageInput" type="file" accept="image/*">
        </label>

        <label>
          Book title
          <input
            id="titleInput"
            type="text"
            value="OF AMBITION AND GRIND"
          >
        </label>

        <label>
          Supporting text
          <input
            id="subInput"
            type="text"
            value="A NEW BOOK"
          >
        </label>

        <label>
          Call to action
          <input
            id="ctaInput"
            type="text"
            value="AVAILABLE NOW"
          >
        </label>

        <label>
          Purchase URL
          <input
            id="urlInput"
            type="url"
            placeholder="https://..."
          >
        </label>


        <h2 class="section-title">Appearance</h2>

        <div class="two-col">

          <label>
            Opening colour
            <input
              id="openingColorInput"
              type="color"
              value="#000000"
            >
          </label>

          <label>
            Reveal colour
            <input
              id="revealColorInput"
              type="color"
              value="#ffffff"
            >
          </label>

        </div>


        <h2 class="section-title">Reveal gradient</h2>

        <div class="two-col">

          <label>
            Gradient start
            <input
              id="gradientStartInput"
              type="color"
              value="#ffffff"
            >
          </label>

          <label>
            Gradient end
            <input
              id="gradientEndInput"
              type="color"
              value="#777777"
            >
          </label>

        </div>

        <label>
          Gradient angle
          <div class="range-row">
            <input
              id="gradientAngleInput"
              type="range"
              min="0"
              max="360"
              value="90"
            >
            <output id="gradientAngleValue">90°</output>
          </div>
        </label>


        <label>
          Photo visibility

          <div class="range-row">
            <input
              id="photoInput"
              type="range"
              min="0"
              max="100"
              value="24"
            >

            <output id="photoValue">24%</output>
          </div>

          <span class="hint">
            How much of the photograph remains visible.
          </span>
        </label>


        <label>
          Reveal opacity

          <div class="range-row">
            <input
              id="revealOpacityInput"
              type="range"
              min="0"
              max="100"
              value="100"
            >

            <output id="revealOpacityValue">100%</output>
          </div>

          <span class="hint">
            Controls the opacity of the semicircle overlay.
          </span>
        </label>


        <label class="check-row">
          <input
            id="transparentInput"
            type="checkbox"
          >

          <span>Transparent reveal shape</span>
        </label>


        <label>
          Animation speed

          <div class="range-row">
            <input
              id="speedInput"
              type="range"
              min="40"
              max="140"
              value="80"
            >

            <output id="speedValue">80%</output>
          </div>
        </label>


        <div class="buttons">
          <button
            id="pngBtn"
            type="button"
          >
            Download PNG
          </button>

          <button
            id="gifBtn"
            class="primary"
            type="button"
          >
            Generate GIF
          </button>
        </div>

        <p
          id="status"
          class="status"
        >
          Loading background image…
        </p>

      </aside>


      <section class="preview-panel">

        <div class="preview-wrap">
          <canvas
            id="canvas"
            width="600"
            height="200"
          ></canvas>
        </div>

        <div class="size-note">
          Final email image: 600 × 200 px
        </div>

      </section>

    </section>

  </main>


  <!-- GIF.js -->
  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>

  <!-- Your application -->
  <script src="./app.js" defer></script>

</body>
</html>
