<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Of Ambition and Grind — Banner Generator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">EMAIL SIGNATURE BANNER</p>
        <h1>Of Ambition and Grind</h1>
        <p class="muted">600 × 200 px · animated editorial banner</p>
      </div>

      <div class="badge">GITHUB PAGES READY</div>
    </header>

    <section class="grid">

      <aside class="panel">

        <h2>Content</h2>

        <label>
          Background image
          <input id="imageInput" type="file" accept="image/*">
        </label>

        <label>
          Book title
          <input
            id="titleInput"
            type="text"
            value="OF AMBITION AND GRIND"
          >
        </label>

        <label>
          Supporting text
          <input
            id="subInput"
            type="text"
            value="A NEW BOOK"
          >
        </label>

        <label>
          Call to action
          <input
            id="ctaInput"
            type="text"
            value="AVAILABLE NOW"
          >
        </label>

        <label>
          Purchase URL
          <input
            id="urlInput"
            type="url"
            placeholder="https://..."
          >
        </label>


        <h2 class="section-title">Appearance</h2>

        <div class="two-col">

          <label>
            Opening colour
            <input
              id="openingColorInput"
              type="color"
              value="#000000"
            >
          </label>

          <label>
            Reveal colour
            <input
              id="revealColorInput"
              type="color"
              value="#ffffff"
            >
          </label>

        </div>


        <label>
          Photo visibility

          <div class="range-row">
            <input
              id="photoInput"
              type="range"
              min="0"
              max="100"
              value="28"
            >

            <output id="photoValue">28%</output>
          </div>

          <span class="hint">
            Controls how much of the photograph remains visible through the overlays.
          </span>
        </label>


        <label>
          Reveal softness

          <div class="range-row">
            <input
              id="softnessInput"
              type="range"
              min="0"
              max="100"
              value="42"
            >

            <output id="softnessValue">42%</output>
          </div>
        </label>


        <label>
          Reveal width

          <div class="range-row">
            <input
              id="spreadInput"
              type="range"
              min="35"
              max="100"
              value="82"
            >

            <output id="spreadValue">82%</output>
          </div>
        </label>


        <label>
          Animation speed

          <div class="range-row">
            <input
              id="speedInput"
              type="range"
              min="40"
              max="140"
              value="80"
            >

            <output id="speedValue">80%</output>
          </div>
        </label>


        <div class="buttons">

          <button id="pngBtn">
            Download PNG
          </button>

          <button id="gifBtn" class="primary">
            Generate GIF
          </button>

        </div>


        <p id="status" class="status">
          Loading original book image…
        </p>

      </aside>


      <section class="preview-panel">

        <div class="preview-wrap">

          <canvas
            id="canvas"
            width="600"
            height="200"
          ></canvas>

        </div>

        <div class="size-note">
          Final email image: 600 × 200 px
        </div>

      </section>

    </section>

  </main>


  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="app.js"></script>

</body>
</html>
