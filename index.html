<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Of Ambition and Grind — Banner</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <main class="app">

    <header class="header">

      <div>
        <p class="eyebrow">
          EMAIL BANNER
        </p>

        <h1>
          Of Ambition and Grind
        </h1>

        <p class="description">
          Create and preview the animated promotional banner.
        </p>
      </div>

    </header>


    <section class="workspace">

      <!-- =========================================
           PREVIEW
      ========================================== -->

      <div class="preview-panel">

        <div class="panel-title">
          Preview
        </div>

        <div class="canvas-wrap">

          <canvas
            id="previewCanvas"
            width="600"
            height="200"
          ></canvas>

          <div
            id="imageError"
            class="image-error"
            hidden
          >
            Could not load the banner image.
            Make sure the file is located at
            <strong>assets/book-background.png</strong>
          </div>

        </div>

        <div class="preview-info">
          600 × 200 px
        </div>

      </div>


      <!-- =========================================
           CONTROLS
      ========================================== -->

      <div class="controls-panel">

        <div class="panel-title">
          Banner settings
        </div>


        <div class="field">

          <label for="bookTitle">
            Book title
          </label>

          <input
            id="bookTitle"
            type="text"
            value="OF AMBITION AND GRIND"
          >

        </div>


        <div class="field">

          <label for="supportingText">
            Supporting text
          </label>

          <input
            id="supportingText"
            type="text"
            value="A practical guide to turning ambition into action."
          >

        </div>


        <div class="field">

          <label for="ctaText">
            CTA
          </label>

          <input
            id="ctaText"
            type="text"
            value="READ THE BOOK"
          >

        </div>


        <div class="field">

          <label for="purchaseUrl">
            Purchase URL
          </label>

          <input
            id="purchaseUrl"
            type="url"
            placeholder="https://..."
          >

        </div>


        <div class="two-column">

          <div class="field">

            <label for="openingColor">
              Opening colour
            </label>

            <input
              id="openingColor"
              type="color"
              value="#000000"
            >

          </div>


          <div class="field">

            <label for="revealColor">
              Reveal colour
            </label>

            <input
              id="revealColor"
              type="color"
              value="#ffffff"
            >

          </div>

        </div>


        <div class="slider-field">

          <div class="slider-heading">

            <label for="photoVisibility">
              Photo visibility
            </label>

            <span id="photoVisibilityValue">
              28
            </span>

          </div>

          <input
            id="photoVisibility"
            type="range"
            min="0"
            max="100"
            value="28"
          >

        </div>


        <div class="slider-field">

          <div class="slider-heading">

            <label for="revealSoftness">
              Reveal softness
            </label>

            <span id="revealSoftnessValue">
              42
            </span>

          </div>

          <input
            id="revealSoftness"
            type="range"
            min="0"
            max="100"
            value="42"
          >

        </div>


        <div class="slider-field">

          <div class="slider-heading">

            <label for="revealWidth">
              Reveal width
            </label>

            <span id="revealWidthValue">
              82
            </span>

          </div>

          <input
            id="revealWidth"
            type="range"
            min="35"
            max="100"
            value="82"
          >

        </div>


        <div class="slider-field">

          <div class="slider-heading">

            <label for="animationSpeed">
              Animation speed
            </label>

            <span id="animationSpeedValue">
              80
            </span>

          </div>

          <input
            id="animationSpeed"
            type="range"
            min="40"
            max="140"
            value="80"
          >

        </div>


        <div class="buttons">

          <button
            id="resetPreview"
            type="button"
            class="secondary-button"
          >
            Restart animation
          </button>

          <button
            id="generateGif"
            type="button"
            class="primary-button"
          >
            Generate GIF
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- GIF library is ONLY needed when exporting.
       It does NOT control the preview animation. -->

  <script
    src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"
  ></script>

  <script
    src="app.js"
  ></script>

</body>
</html>
