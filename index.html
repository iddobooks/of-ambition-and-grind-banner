<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Of Ambition and Grind — Banner Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">EMAIL SIGNATURE BANNER</p>
        <h1>Of Ambition and Grind</h1>
        <p class="muted">600 × 200 px • animated overlay • no author name</p>
      </div>
      <div class="badge">GITHUB PAGES READY</div>
    </header>

    <section class="grid">
      <aside class="panel">
        <label>Background image
          <input id="imageInput" type="file" accept="image/*">
        </label>

        <label>Book title
          <input id="titleInput" value="OF AMBITION AND GRIND">
        </label>

        <label>Supporting text
          <input id="subInput" value="A NEW BOOK">
        </label>

        <label>Call to action
          <input id="ctaInput" value="AVAILABLE NOW">
        </label>

        <label>Purchase URL
          <input id="urlInput" placeholder="https://...">
        </label>

        <div class="controls">
          <label>Overlay strength
            <input id="overlayInput" type="range" min="20" max="90" value="72">
          </label>
          <label>Animation speed
            <input id="speedInput" type="range" min="40" max="140" value="80">
          </label>
        </div>

        <div class="buttons">
          <button id="pngBtn">Download PNG</button>
          <button id="gifBtn" class="primary">Generate GIF</button>
        </div>
        <p id="status" class="status">Ready.</p>
      </aside>

      <section class="preview-panel">
        <div class="preview-wrap">
          <canvas id="canvas" width="600" height="200"></canvas>
        </div>
        <div class="size-note">Final email image: 600 × 200 px</div>
      </section>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"></script>
  <script src="app.js"></script>
</body>
</html>
