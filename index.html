<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Of Ambition and Grind email banner generator">
  <title>Of Ambition and Grind — Banner Generator</title>

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="app">

    <header class="topbar">
      <div>
        <p class="eyebrow">EMAIL SIGNATURE BANNER</p>
        <h1>Of Ambition and Grind</h1>
        <p class="muted">600 × 200 px · animated promotional banner</p>
      </div>

      <div class="badge">GITHUB PAGES READY</div>
    </header>

    <section class="grid">

      <aside class="panel">

        <h2>Content</h2>

        <label for="imageInput">
          Background image
          <input
            id="imageInput"
            type="file"
            accept="image/png,image/jpeg,image/webp,image/gif"
          >
          <span class="hint">
            Choose another image from your computer. The default image is loaded from the assets folder.
          </span>
        </label>

        <label for="titleInput">
          Book title
          <input
            id="titleInput"
            type="text"
            value="OF AMBITION AND GRIND"
          >
        </label>

        <label for="subInput">
          Supporting text
          <input
            id="subInput"
            type="text"
            value="A NEW BOOK"
          >
        </label>

        <label for="ctaInput">
          Call to action
          <input
            id="ctaInput"
            type="text"
            value="AVAILABLE NOW"
          >
        </label>

        <label for="urlInput">
          Purchase URL
          <input
            id="urlInput"
            type="url"
            placeholder="https://..."
          >
        </label>

        <h2 class="section-title">Appearance</h2>

        <div class="two-col">

          <label for="openingColorInput">
            Opening colour
            <input
              id="openingColorInput"
              type="color"
              value="#000000"
            >
          </label>

          <label for="revealColorInput">
            Reveal colour
            <input
              id="revealColorInput"
              type="color"
              value="#ffffff"
            >
          </label>

        </div>

        <label for="photoInput">
          Photo visibility

          <div class="range-row">
            <input
              id="photoInput"
              type="range"
              min="0"
              max="100"
              value="24"
            >
            <output id="photoValue">24%</output>
          </div>

          <span class="hint">
            Controls how strongly the photograph remains visible underneath the overlay.
          </span>
        </label>

        <label for="sharpnessInput">
          Reveal sharpness

          <div class="range-row">
            <input
              id="sharpnessInput"
              type="range"
              min="1"
              max="100"
              value="88"
            >
            <output id="sharpnessValue">88%</output>
          </div>
        </label>

        <label for="spreadInput">
          Reveal spread

          <div class="range-row">
            <input
              id="spreadInput"
              type="range"
              min="35"
              max="100"
              value="78"
            >
            <output id="spreadValue">78%</output>
          </div>
        </label>

        <label for="speedInput">
          Animation speed

          <div class="range-row">
            <input
              id="speedInput"
              type="range"
              min="40"
              max="140"
              value="80"
            >
            <output id="speedValue">80%</output>
          </div>
        </label>

        <div class="buttons">
          <button id="pngBtn" type="button">
            Download PNG
          </button>

          <button id="gifBtn" class="primary" type="button">
            Generate GIF
          </button>
        </div>

        <p id="status" class="status" aria-live="polite">
          Loading background image…
        </p>

      </aside>

      <section class="preview-panel">

        <div class="preview-wrap">
          <canvas
            id="canvas"
            width="600"
            height="200"
          ></canvas>
        </div>

        <div class="size-note">
          Final email image: 600 × 200 px
        </div>

      </section>

    </section>

  </main>

  <!-- GIF library -->
  <script
    src="https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js"
    defer
  ></script>

  <!-- Application -->
  <script src="./app.js" defer></script>

</body>
</html>
